[project]
name = "attest"
version = "0.1.0"
description = "Retrieval-and-grounding layer for support knowledge bases: cited answers, a confidence signal, and graceful refusal."
requires-python = ">=3.10"
dependencies = [
    "rank-bm25>=0.2.2",
    "numpy>=1.24",
    "pyyaml>=6.0",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
dense = ["fastembed>=0.3"]      # semantic half of hybrid retrieval; ~70MB model download on first run
claude = ["anthropic>=0.40"]    # LLM generator; used when ANTHROPIC_API_KEY is set
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
